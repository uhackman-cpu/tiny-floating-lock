name: Play Store AAB Build (unsigned for local signing)

on:
  push:
    branches: ['feature/in-app-appearance-controls']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build release Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release bundle
        run: gradle --no-daemon bundleRelease

      - name: Upload unsigned bundle for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: tiny-floating-lock-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
