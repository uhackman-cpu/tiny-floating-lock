plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uhackmancpu.tinyfloatinglock'
    compileSdk 36

    defaultConfig {
        applicationId 'com.uhackmancpu.tinyfloatinglock'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPass = System.getenv('ANDROID_KEY_PASSWORD')
            if (storePath && storePass && keyAliasValue && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasValue
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
